# =============================================================
# Termux / PRoot ARM64 - OpenJDK 17 build rules (standard)
# Source: ENVIRONMENT.md at repo root. Adjust -Xmx for device RAM.
# =============================================================

# --- JVM limits (standard: see ENVIRONMENT.md) ---
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# --- AAPT2 override (standard: PRoot/ARM64 needs the Termux aapt2) ---
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2

# --- JDK: Termux OpenJDK 17 location ---
# $PREFIX = /data/data/com.termux/files/usr
org.gradle.java.home=/data/data/com.termux/files/usr/lib/jvm/java-17-openjdk

# --- Performance / on-device ---
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# --- Android Gradle Plugin ---
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
